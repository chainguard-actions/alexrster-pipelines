name: Test invalid Azure DevOps token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          azure-devops-project-url: https://dev.azure.com/actionchain-nonexistent-org-xyz/example-project
          azure-pipeline-name: example-pipeline
          azure-devops-token: not-a-real-pat
      - name: Assert action failed with invalid credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure with an invalid PAT / nonexistent org"
            exit 1
          fi
          echo "PASS"
