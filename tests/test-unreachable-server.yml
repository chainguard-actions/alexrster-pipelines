name: Test unreachable Azure DevOps server
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          # Nothing listens on port 1 -> connection refused, no real service contacted
          azure-devops-project-url: http://127.0.0.1:1/tfs/DefaultCollection/example-project
          azure-pipeline-name: example-pipeline
          azure-pipeline-variables: '{"foo": "bar"}'
          azure-devops-token: not-a-real-pat
      - name: Assert action failed gracefully on connection error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when server is unreachable"
            exit 1
          fi
          echo "PASS"
